name: YouTube URL Extractor

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube URL"
        required: true
        type: string
      room_id:
        description: "Chatwork room ID"
        required: true
        type: string
      message_id:
        description: "Chatwork message ID"
        required: true
        type: string
      account_id:
        description: "Chatwork account ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        run: |
          python -m pip install --disable-pip-version-check --no-input --upgrade "yt-dlp[default]"
          python -m yt_dlp --version
          deno --version

      - name: Extract media formats
        id: extract
        env:
          YOUTUBE_URL: ${{ inputs.youtube_url }}
        run: |
          python <<'PY'
          import json
          import os
          import sys
          from urllib.parse import parse_qs, urlparse

          import yt_dlp

          url = os.environ["YOUTUBE_URL"]

          # Try additional official yt-dlp YouTube clients in order.
          # Some clients can expose direct Google Video Server formats without
          # the same requirements as the web client. Availability varies by video.
          clients = ["tv", "tv_downgraded", "web_embedded", "android_vr"]
          last_errors = []

          info = None
          selected_client = None

          for client in clients:
              opts = {
                  "quiet": True,
                  "no_warnings": True,
                  "skip_download": True,
                  "noplaylist": True,
                  "extractor_args": {
                      "youtube": {
                          "player_client": [client],
                      }
                  },
              }

              try:
                  with yt_dlp.YoutubeDL(opts) as ydl:
                      candidate = ydl.extract_info(url, download=False)

                  candidate_formats = [
                      fmt for fmt in candidate.get("formats", [])
                      if fmt.get("url")
                      and (urlparse(fmt["url"]).hostname or "").lower().endswith(".googlevideo.com")
                  ]

                  if candidate_formats:
                      info = candidate
                      selected_client = client
                      break

                  last_errors.append(f"{client}: no googlevideo.com media formats")
              except Exception as exc:
                  last_errors.append(f"{client}: {exc}")

          if info is None:
              with open("result.json", "w", encoding="utf-8") as f:
                  json.dump(
                      {
                          "ok": False,
                          "error": "No supported YouTube client produced googlevideo.com media formats. " + " | ".join(last_errors),
                          "input_url": url,
                      },
                      f,
                      ensure_ascii=False,
                  )
              sys.exit(0)

          formats = []

          for fmt in info.get("formats", []):
              media_url = fmt.get("url")
              if not media_url:
                  continue

              try:
                  parsed = urlparse(media_url)
                  hostname = (parsed.hostname or "").lower()
                  query = parse_qs(parsed.query)
              except Exception:
                  continue

              if not hostname.endswith(".googlevideo.com"):
                  continue

              video_codec = fmt.get("vcodec")
              audio_codec = fmt.get("acodec")
              has_video = video_codec not in (None, "", "none")
              has_audio = audio_codec not in (None, "", "none")

              formats.append({
                  "format_id": fmt.get("format_id"),
                  "itag": query.get("itag", [fmt.get("format_id")])[0],
                  "ext": fmt.get("ext"),
                  "resolution": fmt.get("resolution"),
                  "width": fmt.get("width"),
                  "height": fmt.get("height"),
                  "fps": fmt.get("fps"),
                  "vcodec": video_codec,
                  "acodec": audio_codec,
                  "tbr": fmt.get("tbr"),
                  "has_video": has_video,
                  "has_audio": has_audio,
                  "client": query.get("c", [""])[0],
                  "url": media_url,
              })

          def score(fmt):
              return (
                  1 if fmt["has_video"] and fmt["has_audio"] else 0,
                  1 if fmt.get("ext") == "mp4" else 0,
                  fmt.get("height") or 0,
                  fmt.get("tbr") or 0,
              )

          formats.sort(key=score, reverse=True)

          unique_formats = []
          seen_urls = set()
          for fmt in formats:
              if fmt["url"] in seen_urls:
                  continue
              seen_urls.add(fmt["url"])
              unique_formats.append(fmt)

          result = {
              "ok": True,
              "title": info.get("title") or "YouTube",
              "id": info.get("id"),
              "webpage_url": info.get("webpage_url") or url,
              "extractor": info.get("extractor"),
              "client": selected_client,
              "formats": unique_formats[:8],
          }

          with open("result.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False)
          PY

      - name: Send result to Chatwork
        if: always()
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN || secrets.CHATWORK_TOKEN }}
          ROOM_ID: ${{ inputs.room_id }}
          MESSAGE_ID: ${{ inputs.message_id }}
          ACCOUNT_ID: ${{ inputs.account_id }}
        run: |
          python <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          token = os.environ.get("CHATWORK_API_TOKEN")
          if not token:
              print("CHATWORK_API_TOKEN is not configured in GitHub Actions Secrets.")
              sys.exit(1)

          room_id = os.environ["ROOM_ID"]
          message_id = os.environ["MESSAGE_ID"]
          account_id = os.environ["ACCOUNT_ID"]

          try:
              with open("result.json", encoding="utf-8") as f:
                  result = json.load(f)
          except Exception:
              result = {
                  "ok": False,
                  "error": "yt-dlp did not produce a result.",
              }

          prefix = f"[rp aid={account_id} to={room_id}-{message_id}]"

          if not result.get("ok"):
              error = str(result.get("error", "unknown error"))
              body = (
                  prefix
                  + "\n[info][title]YouTube URL取得失敗[/title]\n"
                  + "[code]"
                  + error
                  + "[/code]\n[/info]"
              )
          else:
              lines = [
                  prefix,
                  "[info][title]" + str(result.get("title", "YouTube")) + "[/title]",
                  "ID: " + str(result.get("id") or "-"),
                  "client: " + str(result.get("client") or "-"),
              ]

              formats = result.get("formats", [])

              if not formats:
                  lines.append("googlevideo.com の取得可能な形式が見つかりませんでした。")
              else:
                  for i, fmt in enumerate(formats, 1):
                      video = fmt.get("vcodec") or "-"
                      audio = fmt.get("acodec") or "-"
                      resolution = fmt.get("resolution") or "-"
                      ext = fmt.get("ext") or "-"
                      itag = fmt.get("itag") or fmt.get("format_id") or "-"
                      fps = fmt.get("fps") or "-"
                      client = fmt.get("client") or "-"

                      lines.append(
                          f"\n[{i}] itag={itag} / {resolution} / {ext} / fps={fps}"
                      )
                      lines.append(
                          f"video={video} / audio={audio} / client={client}"
                      )
                      lines.append("[url]" + fmt["url"] + "[/url]")

              lines.append("[/info]")
              body = "\n".join(lines)

          data = urllib.parse.urlencode({
              "body": body,
              "self_unread": "0",
          }).encode()

          req = urllib.request.Request(
              f"https://api.chatwork.com/v2/rooms/{room_id}/messages",
              data=data,
              method="POST",
              headers={
                  "x-chatworktoken": token,
                  "Content-Type": "application/x-www-form-urlencoded",
              },
          )

          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  print("Chatwork response:", response.status)
          except Exception as exc:
              print("Chatwork API request failed:", exc)
              sys.exit(1)
          PY
